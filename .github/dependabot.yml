version: 2

updates:
  - package-ecosystem: composer
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: chore", "dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Dev tooling (Pest, Larastan, Pint, Testbench…) arrives as one PR.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Pest 5 needs PHP 8.4+ and symfony/process 8 (Laravel 13 only), so it
      # cannot run on PHP 8.3.36 or Laravel 11/12. Upgrade by hand once those
      # are dropped (LRVL-76).
      # A version range, not update-types: we commit no composer.lock, so
      # Dependabot does not know the current version and skips update-types.
      - dependency-name: pestphp/pest
        versions: [">=5.0"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels: ["type: chore", "dependencies"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      all-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/docker/php"
    target-branch: develop
    schedule:
      interval: monthly
    labels: ["type: chore", "dependencies"]
    commit-message:
      prefix: "build(deps)"
