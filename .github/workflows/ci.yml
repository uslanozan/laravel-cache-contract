# =============================================================================
# CI: quality gates + test matrix
# =============================================================================
# Branch rulesets require ONE check from here: "CI result". Matrix job names
# change whenever the matrix changes; an aggregator job keeps the required
# check name stable. It passes only when every job it depends on succeeded:
# a skipped job counts as a failure, so a broken condition cannot turn the
# whole matrix off and still report green.
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (lint + static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: redis
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-quality-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-quality-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Code style (Pint)
        run: composer lint

      - name: Static analysis (Larastan)
        run: composer analyse

  tests:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.stability }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Supported range: ADR 0003 / docs/ROADMAP.md D5.
      # Laravel 11 starts at 11.23 (first release with Cache::flexible). Its
      # security support ended 2026-03-12; it stays in the matrix because
      # company projects still run it.
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["11", "12", "13"]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: "11"
            framework: "^11.23"
            testbench: "^9.0"
          - laravel: "12"
            framework: "^12.0"
            testbench: "^10.0"
          - laravel: "13"
            framework: "^13.0"
            testbench: "^11.0"
        exclude:
          # A support-policy exclusion, not a Composer conflict: Laravel 11's
          # composer.json has no PHP upper bound, but Laravel supports 11 on
          # PHP 8.2-8.4 only, and ADR 0003 claims support for exactly this
          # matrix "minus Laravel 11 on PHP 8.5".
          - laravel: "11"
            php: "8.5"

    services:
      redis:
        # Keep in sync with the redis service in docker-compose.yml.
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis
          coverage: none
          tools: composer:v2

      # Before "Pin Laravel version", so the key hashes the committed
      # composer.json rather than the one rewritten for this cell.
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.stability }}-

      - name: Pin Laravel version
        run: composer require "laravel/framework:${{ matrix.framework }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      # Every Laravel 11 release has security advisories that will never be
      # patched (end of life since 2026-03-12), and Composer refuses to install
      # packages with known advisories. Company projects still run Laravel 11,
      # so we keep testing it: the block is lifted for laravel/framework only,
      # in this job only. Laravel 12/13 jobs keep the protection. See ADR 0003.
      - name: Allow Laravel 11 despite its unpatched advisories
        if: matrix.laravel == '11'
        run: composer config policy.advisories.ignore --json '["laravel/framework"]'

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      # The service health check already waits for Redis; this fails fast with
      # one clear message if phpredis is missing or the host/port are wrong,
      # instead of every integration test failing with a RedisException.
      - name: Check Redis is reachable
        run: |
          php <<'PHP'
          <?php
          $redis = new Redis();
          $redis->connect(getenv('REDIS_HOST'), (int) getenv('REDIS_PORT'), 2.0);
          if (! $redis->ping()) {
              fwrite(STDERR, "Redis did not answer PING.\n");
              exit(1);
          }
          echo 'Redis is reachable at '.getenv('REDIS_HOST').':'.getenv('REDIS_PORT').PHP_EOL;
          PHP

      - name: Run tests
        run: composer test

  result:
    # The single required status check (see the header).
    name: CI result
    needs: [quality, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          for r in "${{ needs.quality.result }}" "${{ needs.tests.result }}"; do
            if [ "$r" != "success" ]; then
              echo "A required job did not succeed ($r)."; exit 1
            fi
          done
          echo "All jobs succeeded."
