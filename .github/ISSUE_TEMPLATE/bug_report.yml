name: 🐛 Bug report
description: Something in the package behaves incorrectly
title: "[Bug]: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please [search existing issues](../issues?q=is%3Aissue) first.
        Security problems must **not** be reported here; see the security policy.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: One or two sentences. Details go below.
      placeholder: "`ManagedCache::remember()` returns a cached `null` as a miss and calls the loader again."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: |
        The smallest definition + code that triggers the bug. A failing test is ideal.
      render: php
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the exact exception message and stack trace if there is one.
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "v0.3.1 or commit SHA"
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "13.4.0"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.4.2"
    validations:
      required: true

  - type: dropdown
    id: cache-setup
    attributes:
      label: Cache setup
      multiple: true
      options:
        - Redis (phpredis)
        - Redis (predis)
        - Redis Cluster / Sentinel
        - Other store (array, file, database…)
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I removed secrets, tokens and personal data from everything above
          required: true
